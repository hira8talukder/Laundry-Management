<script>
  const users = [
    { id: '#1001', name: 'Arif Hasan', email: 'arif@example.com', phone: '+880123456789', joined: '2024-09-01', status: 'Active' },
    { id: '#1002', name: 'Salma Akter', email: 'salma@example.com', phone: '+880112233445', joined: '2024-10-15', status: 'Active' },
    { id: '#1003', name: 'Tanvir Rahman', email: 'tanvir@example.com', phone: '+880198765432', joined: '2024-11-22', status: 'Inactive' },
    { id: '#1004', name: 'Rehana Jahan', email: 'rehana@example.com', phone: '+880199988877', joined: '2025-01-03', status: 'Active' },
    { id: '#1005', name: 'Kamal Hossain', email: 'kamal@example.com', phone: '+880122334455', joined: '2024-12-10', status: 'Active' },
    { id: '#1006', name: 'Mina Karim', email: 'mina@example.com', phone: '+880133344455', joined: '2024-11-05', status: 'Inactive' },
    { id: '#1007', name: 'Rafiq Islam', email: 'rafiq@example.com', phone: '+880144455566', joined: '2025-02-12', status: 'Active' },
    { id: '#1008', name: 'Fatima Noor', email: 'fatima@example.com', phone: '+880155566677', joined: '2025-03-20', status: 'Active' },
    { id: '#1009', name: 'Nabil Khan', email: 'nabil@example.com', phone: '+880166677788', joined: '2025-04-10', status: 'Inactive' },
    { id: '#1010', name: 'Jahanara Begum', email: 'jahanara@example.com', phone: '+880177788899', joined: '2025-05-01', status: 'Active' }
  ];

  const usersGrid = document.getElementById('usersGrid');
  const searchInput = document.getElementById('searchInput');

  function renderUsers(filter = '') {
    const filterLower = filter.toLowerCase();
    const filtered = users.filter(user =>
      user.name.toLowerCase().includes(filterLower) ||
      user.email.toLowerCase().includes(filterLower) ||
      user.phone.includes(filterLower)
    );

    usersGrid.innerHTML = '';

    if(filtered.length === 0) {
      usersGrid.innerHTML = `<p style="font-size:18px; color:#8540cf; grid-column: 1 / -1; text-align:center;">No users found.</p>`;
      return;
    }

    filtered.forEach(user => {
      const joinedDate = new Date(user.joined).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      const statusClass = user.status.toLowerCase() === 'active' ? 'status-active' : 'status-inactive';

      const card = document.createElement('div');
      card.className = 'user-card';
      card.innerHTML = `
        <div class="user-name">${user.name}</div>
        <div class="user-info"><i class="fa-solid fa-envelope"></i> ${user.email}</div>
        <div class="user-info"><i class="fa-solid fa-phone"></i> ${user.phone}</div>
        <div class="user-joined">Joined: ${joinedDate}</div>
        <div class="status-badge ${statusClass}">${user.status}</div>
      `;
      usersGrid.appendChild(card);
    });
  }

  searchInput.addEventListener('input', e => {
    renderUsers(e.target.value);
  });

  // Initial render
  renderUsers();
</script>

</body>
