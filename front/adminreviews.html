  <script>
    const monthInput = document.getElementById("monthPicker");
    const allCheckbox = document.getElementById("allCheckbox");

    allCheckbox.addEventListener("change", () => {
      monthInput.disabled = allCheckbox.checked;
    });

    function filterReviews() {
      const isAll = allCheckbox.checked;
      const selectedMonth = monthInput.value; // e.g., "2025-06"
      const reviews = document.querySelectorAll(".review-box");

      reviews.forEach((review) => {
        const reviewDate = review.querySelector(".date").textContent; // e.g., "2025-06-25"
        const reviewMonth = reviewDate.slice(0, 7); // e.g., "2025-06"

        if (isAll || reviewMonth === selectedMonth) {
          review.style.display = "block";
        } else {
          review.style.display = "none";
        }
      });
    }

     // ✅ Fetch all reviews for admin
  document.addEventListener("DOMContentLoaded", () => {
    fetch("../backend/get_all_reviews.php")
      .then(res => res.json())
      .then(reviews => {
        const container = document.getElementById("review-results");
        container.innerHTML = "";

        reviews.forEach(r => {
          const reviewHTML = `
            <div class="review-box" data-id="${r.id}">
              <div class="name">${r.name}</div>
              <div class="course">${r.service}</div>
              <div class="rating">${'★'.repeat(Math.floor(r.rating))}${(r.rating % 1 ? '½' : '')}</div>
              <div class="review-text">${r.review_text}</div>
              <div class="date">${r.review_date}</div>
              <button onclick="editReview(${r.id}, \`${r.review_text}\`)">✏️ Edit</button>
              <button onclick="deleteReview(${r.id})">🗑️ Delete</button>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', reviewHTML);
        });
      });
  });

  function deleteReview(id) {
  if (confirm("Are you sure you want to delete this review?")) {
    fetch(`../backend/delete_review.php?id=${id}`)
      .then(res => res.text())
      .then(response => {
        if (response.includes("success")) {
          alert("Deleted successfully");
          location.reload();
        } else {
          alert("Failed to delete");
        }
      });
  }
}

function editReview(id, oldText) {
  const newText = prompt("Edit the review:", oldText);
  if (newText && newText !== oldText) {
    fetch("../backend/update_review.php", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: `id=${id}&review_text=${encodeURIComponent(newText)}`
    })
    .then(res => res.text())
    .then(response => {
      if (response.includes("success")) {
        alert("Updated successfully");
        location.reload();
      } else {
        alert("Update failed");
      }
    });
  }
}
