  <script>
    function toggleSelectAll(source) {
      const checkboxes = document.querySelectorAll('.rowCheckbox');
      checkboxes.forEach(cb => cb.checked = source.checked);
    }

    function searchPaidOrders() {
      const date = document.getElementById('searchDate').value;
      if (!date) {
        alert("Please select a date.");
        return;
      }

      const startTime = `${date} 10:00:00`;
      const endTime = `${date} 22:00:00`;

      // Fetch from backend PHP script
      fetch(`get_paid_orders.php?start=${startTime}&end=${endTime}`)
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('orderTableBody');
          tbody.innerHTML = '';
          if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4">No paid orders found for selected time range.</td></tr>';
            return;
          }
          data.forEach(order => {
            const row = `
              <tr>
                <td><input type="checkbox" class="rowCheckbox"></td>
                <td>${order.order_id}</td>
                <td>${order.customer_name}</td>
                <td>$${parseFloat(order.total_payment).toFixed(2)}</td>
              </tr>`;
            tbody.innerHTML += row;
          });
        })
        .catch(err => {
          console.error('Fetch error:', err);
          alert('Failed to fetch data.');
        });
    }
  </script>
